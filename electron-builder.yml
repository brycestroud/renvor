appId: com.gsfieldops.app
productName: gs-field-ops
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - drizzle/**/*
  - package.json
extraResources:
  - from: drizzle
    to: drizzle
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-Setup-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
