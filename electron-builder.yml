appId: com.renvor.app
productName: Renvor
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - drizzle/**/*
  - package.json
extraResources:
  - from: drizzle
    to: drizzle
asarUnpack:
  - '**/*.node'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-Setup-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
